<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Whiteboard Studio - Trình Xem & Điều Khiển Dự Án</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #12141A;
      --bg-surface: #1E222D;
      --bg-card: #262B3A;
      --border: #323A4D;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --success: #10B981;
      --warning: #F59E0B;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      background: var(--bg-surface);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      height: 60px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #FBBF24;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-selector-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .project-selector-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    select#project-select {
      background: transparent;
      color: #FFFFFF;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 320px;
    }

    select#project-select option {
      background: #1E222D;
      color: white;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161A23;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-memory {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34D399;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* MAIN VIEW */
    #main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    #stage-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0E14;
      padding: 16px;
      position: relative;
    }

    #stage-viewport {
      width: 960px;
      height: 540px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      background: #F5EBD7;
    }

    #stage-iframe {
      width: 1920px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: 0 0;
      border: none;
      display: block;
    }

    #video-player-container {
      width: 960px;
      height: 540px;
      display: none;
      background: black;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid var(--border);
    }

    #video-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 12px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* SIDEBAR */
    #sidebar {
      width: 380px;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: #E5E7EB;
    }

    .project-meta-pill {
      font-size: 0.72rem;
      background: var(--bg-card);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--text-muted);
    }

    #beats-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scene-group-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #93C5FD;
      padding: 6px 4px 2px 4px;
      border-bottom: 1px solid #2D3748;
      margin-top: 6px;
    }

    .beat-card {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .beat-card:hover {
      background: #2E3447;
      transform: translateX(2px);
    }

    .beat-card.active {
      border-left-color: var(--success);
      background: #1F382E;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    .beat-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .beat-id {
      font-weight: 700;
      font-size: 0.82rem;
      color: #F9FAFB;
    }

    .beat-time-badge {
      font-size: 0.72rem;
      font-family: monospace;
      color: #A7F3D0;
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .beat-trigger {
      font-size: 0.76rem;
      color: #60A5FA;
    }

    .beat-elements {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* CONTROLS PANEL */
    #controls-panel {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100px;
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #timeline-scrubber {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      accent-color: var(--success);
      cursor: pointer;
      background: #2D3748;
    }

    .time-readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: #F3F4F6;
      min-width: 170px;
      text-align: right;
    }

    .buttons-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--bg-card);
      color: white;
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: #374151; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); border-color: var(--success); }
    .btn-success:hover { background: #059669; }

    .status-hint {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div class="brand-title">
        <span>🎬</span> AI Whiteboard Studio
      </div>

      <div class="project-selector-wrapper">
        <span class="project-selector-label">DỰ ÁN:</span>
        <select id="project-select">
          <option value="">Đang tải danh sách...</option>
        </select>
      </div>
    </div>

    <div class="header-center">
      <button class="tab-btn active" id="tab-stage" title="Mô phỏng ngòi bút vẽ tay và căn nhịp âm thanh">
        ✍️ Bàn Tay Vẽ Thực Tế
      </button>
      <button class="tab-btn" id="tab-video" title="Xem trực tiếp file video MP4 đã kết xuất hoàn chỉnh">
        🎥 Video MP4 Hoàn Chỉnh
      </button>
    </div>

    <div class="header-right">
      <div class="badge-memory" id="memory-badge" title="Bộ nhớ tự tiến hóa">
        🧠 Memory Synced (10 Rules, 8 Lessons, 9 Metaphors)
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div id="main-content">
    <div id="stage-panel">
      <!-- Stage Canvas Iframe -->
      <div id="stage-viewport">
        <iframe id="stage-iframe" src="../engine/stage.html"></iframe>
      </div>

      <!-- MP4 Video Player -->
      <div id="video-player-container">
        <video id="video-element" controls preload="metadata"></video>
      </div>

      <!-- Loading Overlay -->
      <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <div id="loading-text" style="font-size: 0.9rem; font-weight: 600;">Đang tải và biên dịch Storyboard...</div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Phân Cảnh & Visual Beats</div>
        <div class="project-meta-pill" id="sidebar-meta">0 Beats</div>
      </div>
      <div id="beats-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- AUDIO ELEMENT (for canvas playback sync) -->
  <audio id="narration-audio" preload="auto" style="display: none;"></audio>

  <!-- CONTROLS -->
  <div id="controls-panel">
    <div class="scrubber-row">
      <input type="range" id="timeline-scrubber" min="0" max="15000" value="0" step="33">
      <div class="time-readout" id="time-display">00:00.000 / 00:00.000</div>
    </div>
    <div class="buttons-row">
      <button class="btn btn-primary" id="btn-play">▶ Play</button>
      <button class="btn" id="btn-prev-sec" title="Lùi 1 giây">-1s</button>
      <button class="btn" id="btn-prev-frame" title="Lùi 1 khung hình (33ms)">❮ Frame</button>
      <button class="btn" id="btn-next-frame" title="Tiến 1 khung hình (33ms)">Frame ❯</button>
      <button class="btn" id="btn-next-sec" title="Tiến 1 giây">+1s</button>
      <button class="btn" id="btn-restart" title="Về đầu video">↺ Đầu</button>

      <div class="status-hint">
        <span id="audio-status-indicator">🔊 Audio Narration Sẵn Sàng</span>
        <span>•</span>
        <span>Phím tắt: [Space] Play/Pause, [←/→] Tua khung hình</span>
      </div>
    </div>
  </div>

  <!-- CLIENT SCRIPT -->
  <script type="module">
    let projects = [];
    let currentProjectId = '';
    let currentProject = null;
    let compiledStageData = null;

    let isPlaying = false;
    let currentTimeMs = 0;
    let totalDurationMs = 15000;
    let animFrame = null;
    let lastTimestamp = 0;
    let currentMode = 'stage'; // 'stage' or 'video'

    // DOM Elements
    const projectSelect = document.getElementById('project-select');
    const tabStage = document.getElementById('tab-stage');
    const tabVideo = document.getElementById('tab-video');
    const stageViewport = document.getElementById('stage-viewport');
    const videoContainer = document.getElementById('video-player-container');
    const videoElement = document.getElementById('video-element');
    const stageIframe = document.getElementById('stage-iframe');
    const audioElement = document.getElementById('narration-audio');
    const scrubber = document.getElementById('timeline-scrubber');
    const timeDisplay = document.getElementById('time-display');
    const btnPlay = document.getElementById('btn-play');
    const btnPrevSec = document.getElementById('btn-prev-sec');
    const btnNextSec = document.getElementById('btn-next-sec');
    const btnPrevFrame = document.getElementById('btn-prev-frame');
    const btnNextFrame = document.getElementById('btn-next-frame');
    const btnRestart = document.getElementById('btn-restart');
    const beatsList = document.getElementById('beats-list');
    const sidebarMeta = document.getElementById('sidebar-meta');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const audioStatusIndicator = document.getElementById('audio-status-indicator');

    function formatTime(ms) {
      if (isNaN(ms) || ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const remS = s % 60;
      const remMs = Math.floor(ms % 1000);
      return `${String(m).padStart(2, '0')}:${String(remS).padStart(2, '0')}.${String(remMs).padStart(3, '0')}`;
    }

    function showLoading(msg) {
      loadingText.innerText = msg;
      loadingOverlay.style.display = 'flex';
    }

    function hideLoading() {
      loadingOverlay.style.display = 'none';
    }

    function updateTimeDisplay() {
      timeDisplay.innerText = `${formatTime(currentTimeMs)} / ${formatTime(totalDurationMs)}`;
      scrubber.value = currentTimeMs;
      highlightActiveBeat(currentTimeMs);
    }

    function seekTo(timeMs) {
      currentTimeMs = Math.max(0, Math.min(totalDurationMs, timeMs));
      updateTimeDisplay();

      if (currentMode === 'stage') {
        if (stageIframe.contentWindow && stageIframe.contentWindow.renderFrameAt) {
          stageIframe.contentWindow.renderFrameAt(currentTimeMs);
        }
        if (audioElement && audioElement.src && Math.abs(audioElement.currentTime - currentTimeMs / 1000) > 0.15) {
          audioElement.currentTime = currentTimeMs / 1000;
        }
      } else {
        if (videoElement && Math.abs(videoElement.currentTime - currentTimeMs / 1000) > 0.15) {
          videoElement.currentTime = currentTimeMs / 1000;
        }
      }
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      btnPlay.innerHTML = '⏸ Pause';
      lastTimestamp = performance.now();

      if (currentMode === 'stage') {
        if (audioElement && audioElement.src) {
          audioElement.currentTime = currentTimeMs / 1000;
          audioElement.play().catch(e => console.log('Audio autoplay prevented:', e));
        }
        playLoop();
      } else {
        videoElement.currentTime = currentTimeMs / 1000;
        videoElement.play();
      }
    }

    function pause() {
      if (!isPlaying) return;
      isPlaying = false;
      btnPlay.innerHTML = '▶ Play';
      if (animFrame) cancelAnimationFrame(animFrame);

      if (currentMode === 'stage') {
        if (audioElement) audioElement.pause();
      } else {
        if (videoElement) videoElement.pause();
      }
    }

    function togglePlay() {
      if (isPlaying) pause();
      else play();
    }

    function playLoop() {
      if (!isPlaying || currentMode !== 'stage') return;
      const now = performance.now();
      const dt = now - lastTimestamp;
      lastTimestamp = now;

      // Sync with audio if audio is running
      if (audioElement && !audioElement.paused && audioElement.duration) {
        currentTimeMs = audioElement.currentTime * 1000;
      } else {
        currentTimeMs += dt;
      }

      if (currentTimeMs >= totalDurationMs) {
        currentTimeMs = totalDurationMs;
        seekTo(currentTimeMs);
        pause();
        return;
      }

      seekTo(currentTimeMs);
      animFrame = requestAnimationFrame(playLoop);
    }

    // Video events
    videoElement.addEventListener('timeupdate', () => {
      if (currentMode === 'video' && !videoElement.paused) {
        currentTimeMs = videoElement.currentTime * 1000;
        updateTimeDisplay();
      }
    });

    videoElement.addEventListener('ended', () => {
      pause();
    });

    // Scrubber input
    scrubber.addEventListener('input', (e) => {
      seekTo(parseFloat(e.target.value));
    });

    // Control buttons
    btnPlay.addEventListener('click', togglePlay);
    btnPrevFrame.addEventListener('click', () => { pause(); seekTo(currentTimeMs - 33.33); });
    btnNextFrame.addEventListener('click', () => { pause(); seekTo(currentTimeMs + 33.33); });
    btnPrevSec.addEventListener('click', () => { pause(); seekTo(currentTimeMs - 1000); });
    btnNextSec.addEventListener('click', () => { pause(); seekTo(currentTimeMs + 1000); });
    btnRestart.addEventListener('click', () => { pause(); seekTo(0); });

    // Mode switching
    function setMode(mode) {
      currentMode = mode;
      pause();

      if (mode === 'stage') {
        tabStage.classList.add('active');
        tabVideo.classList.remove('active');
        stageViewport.style.display = 'block';
        videoContainer.style.display = 'none';
        seekTo(currentTimeMs);
      } else {
        tabVideo.classList.add('active');
        tabStage.classList.remove('active');
        stageViewport.style.display = 'none';
        videoContainer.style.display = 'block';
        if (currentProject && currentProject.videoUrl) {
          videoElement.src = currentProject.videoUrl;
          seekTo(currentTimeMs);
        }
      }
    }

    tabStage.addEventListener('click', () => setMode('stage'));
    tabVideo.addEventListener('click', () => {
      if (!currentProject || !currentProject.hasMp4) {
        alert('Dự án này chưa có file output.mp4 hoàn chỉnh! Vui lòng xem chế độ Bàn Tay Vẽ hoặc xuất video.');
        return;
      }
      setMode('video');
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        pause();
        seekTo(currentTimeMs - (e.shiftKey ? 1000 : 33.33));
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        pause();
        seekTo(currentTimeMs + (e.shiftKey ? 1000 : 33.33));
      }
    });

    // Load project list
    async function initProjects() {
      try {
        const res = await fetch('/api/projects');
        const json = await res.json();
        if (json.success && json.projects.length > 0) {
          projects = json.projects;
          projectSelect.innerHTML = '';
          for (const p of projects) {
            const opt = document.createElement('option');
            opt.value = p.id;
            const dur = (p.durationMs / 1000).toFixed(0);
            const statusTag = p.hasMp4 ? `[MP4 ${p.mp4SizeMB}MB]` : `[Storyboard]`;
            opt.textContent = `${statusTag} ${p.title} (${dur}s)`;
            projectSelect.appendChild(opt);
          }

          // Select the first project (or lion if exists)
          const lion = projects.find(p => p.id.includes('su-tu')) || projects[0];
          projectSelect.value = lion.id;
          loadProject(lion.id);
        }
      } catch (err) {
        console.error('Failed to load project list:', err);
      }
    }

    // Load specific project
    async function loadProject(projectId) {
      pause();
      currentProjectId = projectId;
      currentProject = projects.find(p => p.id === projectId) || null;

      showLoading(`Đang nạp và giải mã dự án: ${projectId}...`);

      // Update Audio
      if (currentProject && currentProject.audioUrl) {
        audioElement.src = currentProject.audioUrl;
        audioStatusIndicator.innerText = `🔊 Âm thanh thuyết minh: Sẵn sàng`;
        audioStatusIndicator.style.color = '#34D399';
      } else {
        audioElement.src = '';
        audioStatusIndicator.innerText = `🔇 Không tìm thấy audio thuyết minh`;
        audioStatusIndicator.style.color = '#9CA3AF';
      }

      // Update Video tab state
      if (currentProject && currentProject.hasMp4) {
        tabVideo.style.opacity = '1';
        tabVideo.title = `Xem video hoàn chỉnh (${currentProject.mp4SizeMB} MB)`;
        videoElement.src = currentProject.videoUrl;
      } else {
        tabVideo.style.opacity = '0.5';
        tabVideo.title = `Dự án này chưa có output.mp4`;
        if (currentMode === 'video') setMode('stage');
      }

      // Fetch compiled storyboard
      try {
        const res = await fetch(`/api/compile?project=${encodeURIComponent(projectId)}`);
        const json = await res.json();
        if (!json.success) {
          throw new Error(json.error || 'Biên dịch storyboard thất bại');
        }

        compiledStageData = json.data;
        totalDurationMs = json.totalDurationMs || 15000;
        scrubber.max = totalDurationMs;
        currentTimeMs = 0;

        // Render sidebar beats
        renderBeats(compiledStageData.storyboard);

        // Send compiled data to stage iframe
        await initStageIframe(compiledStageData);

        seekTo(0);
        hideLoading();
      } catch (err) {
        hideLoading();
        alert('Lỗi nạp dự án: ' + err.message);
        console.error(err);
      }
    }

    async function initStageIframe(data) {
      return new Promise((resolve) => {
        function tryInit() {
          if (stageIframe.contentWindow && stageIframe.contentWindow.initStage) {
            stageIframe.contentWindow.initStage(data);
            resolve();
          } else {
            setTimeout(tryInit, 80);
          }
        }
        tryInit();
      });
    }

    function renderBeats(storyboard) {
      beatsList.innerHTML = '';
      let totalBeats = 0;

      for (let sIdx = 0; sIdx < (storyboard.scenes || []).length; sIdx++) {
        const scene = storyboard.scenes[sIdx];
        const sceneHeader = document.createElement('div');
        sceneHeader.className = 'scene-group-header';
        sceneHeader.innerText = `Cảnh ${sIdx + 1}: ${scene.sceneId || 'Phân đoạn'}`;
        beatsList.appendChild(sceneHeader);

        for (const beat of (scene.beats || [])) {
          totalBeats++;
          const card = document.createElement('div');
          card.className = 'beat-card';
          card.dataset.startMs = beat.startMs;
          card.dataset.endMs = (beat.startMs + (beat.durationMs || 1000));

          const triggerText = beat.triggerWord ? `"${beat.triggerWord}"` : 'Theo nhịp kịch bản';
          const elemCount = (beat.elements || []).length;

          card.innerHTML = `
            <div class="beat-card-top">
              <span class="beat-id">${beat.beatId}</span>
              <span class="beat-time-badge">${formatTime(beat.startMs)}</span>
            </div>
            <div class="beat-trigger">Từ khóa: ${triggerText}</div>
            <div class="beat-elements">${elemCount} phần tử đồ họa (Thời lượng: ${(beat.durationMs/1000).toFixed(1)}s)</div>
          `;

          card.addEventListener('click', () => {
            pause();
            seekTo(beat.startMs);
          });

          beatsList.appendChild(card);
        }
      }

      sidebarMeta.innerText = `${totalBeats} Beats | ${(totalDurationMs/1000).toFixed(1)}s`;
    }

    function highlightActiveBeat(ms) {
      const cards = beatsList.querySelectorAll('.beat-card');
      cards.forEach(card => {
        const start = parseFloat(card.dataset.startMs);
        const end = parseFloat(card.dataset.endMs);
        if (ms >= start && ms <= end) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });
    }

    // Change project handler
    projectSelect.addEventListener('change', (e) => {
      if (e.target.value) {
        loadProject(e.target.value);
      }
    });

    // Start everything
    window.addEventListener('load', () => {
      initProjects();
    });
  </script>
</body>
</html>
